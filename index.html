<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f9b7a"><title>TiffinTrack</title><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1b2d;--mute:#6b7a90;--line:#e6ecf4;--soft:#eef3f9;--acc:#0f9b7a;--acc2:#1d6fa5;--yes:#12a37f;--no:#e5564d;--sh:0 8px 30px #1b2b4514;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0a111e;--card:#131e32;--ink:#eaf0fb;--mute:#8d9eb8;--line:#233250;--soft:#1a2842;--sh:0 8px 30px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .15s,background .2s,opacity .2s}button:active{transform:scale(.95)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.app{max-width:560px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.view{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:22px;margin:6px 0 16px;letter-spacing:-.5px}h3{margin:0 0 12px;font-size:16px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:26px;padding:16px 18px 20px;box-shadow:var(--sh)}
.mbar{display:flex;align-items:center;justify-content:space-between}.mbar b{font-size:16px}.arrow{width:38px;height:38px;border-radius:50%;background:#ffffff2e;color:#fff;font-size:22px;line-height:1}
.lbl{opacity:.85;font-size:13px;margin-top:14px}.big{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:2px 0 10px}
.chips{display:flex;gap:8px}.chips span{background:#ffffff2e;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.wk div{text-align:center;font-size:11px;font-weight:600;color:var(--mute);padding-bottom:4px}
.day{aspect-ratio:1;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:650;font-size:14px}
.day.today{box-shadow:inset 0 0 0 2px var(--acc2)}.day.sel{background:var(--acc);color:#fff}
.dots{display:flex;gap:3px;height:5px}.dot{width:5px;height:5px;border-radius:50%;background:#9aa8bb55}.dot.y{background:var(--yes)}.dot.n{background:var(--no)}.sel .dot.y{background:#fff}.sel .dot.n{background:#ffd0cc}
.mi{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}.mi:last-child{border:0}.mi small{display:block;color:var(--mute);margin-top:3px;font-size:12.5px}.mi span:last-child{color:var(--mute);white-space:nowrap}.empty{color:var(--mute);font-size:14px;padding:4px 0}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px;font-weight:600}
input{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:13px 14px;font-size:16px;outline:0;transition:border .2s}input:focus{border-color:var(--acc)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .f{margin:0}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}.seg button{flex:1;padding:10px 0;border-radius:11px;font-weight:650;font-size:14px;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px #0002}
.btn{border-radius:14px;padding:14px 16px;font-weight:700;background:var(--soft);width:100%}.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{color:var(--mute);font-size:12.5px;margin:-4px 0 12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:5}.nav button{flex:1;max-width:240px;padding:10px;border-radius:14px;font-size:13px;font-weight:650;color:var(--mute)}.nav button.on{background:var(--soft);color:var(--acc)}.nav i{display:block;font-style:normal;font-size:20px}
.sheet{position:fixed;inset:0;pointer-events:none;z-index:20}.sheet.open{pointer-events:auto}.scrim{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .25s}.open .scrim{opacity:1}
.sp{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}.open .sp{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}.sp h2{margin:0 0 14px;font-size:18px}
.meal{background:var(--soft);border-radius:18px;padding:12px;margin-bottom:10px}.mt{display:flex;align-items:center;justify-content:space-between;gap:8px}.mt b{display:block}.mt small{color:var(--mute)}
.ch{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:12px}.ch button{padding:9px 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}.ch .y{background:var(--yes);color:#fff}.ch .n{background:var(--no);color:#fff}.ch .u{background:var(--line);color:var(--ink)}
.meal input{margin-top:10px;padding:11px 12px;background:var(--card);font-size:15px}
.tot{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 14px;color:var(--mute)}.tot b{font-size:22px;color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main class="app">
<section id="v-home" class="view">
<h1>🍱 TiffinTrack</h1>
<div class="hero"><div class="mbar"><button class="arrow" id="prev" aria-label="Previous month">‹</button><b id="mt"></b><button class="arrow" id="next" aria-label="Next month">›</button></div>
<div class="lbl">Payable</div><div class="big" id="pay">₹0</div><div class="chips"><span id="rc"></span><span id="mc"></span></div></div>
<div class="card"><div class="wk"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div></div><div class="days" id="days"></div></div>
