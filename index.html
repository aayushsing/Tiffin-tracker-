<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f9b7a"><title>TiffinTrack</title><style>

</style></head><body><main class="app">

<h1>🍱 TiffinTrack</h1>
<div class="hero"><div class="mbar"><button class="arrow" id="prev" aria-label="Previous month">‹</button><b id="mt"></b><button class="arrow" id="next" aria-label="Next month">›</button></div>

<div class="f" id="fr" hidden><div class="row2"><input id="b1" type="date" aria-label="From date"><input id="b2" type="date" aria-label="To date"></div><div class="row2" style="margin-top:10px"><button class="btn" id="q1" type="button">1 – 15</button><button class="btn" id="q2" type="button">16 – end</button></div></div>

</section>
<nav class="nav"><button data-v="home" class="on"><i>📅</i>Tiffin</button><button data-v="set"><i>⚙️</i>Settings</button></nav>
<div class="sheet" id="sheet"><div class="scrim" id="scrim"></div><div class="sp" role="dialog" aria-modal="true"><div class="grab"></div><h2 id="st"></h2><div id="meals"></div><div class="tot"><span>Day total</span><b id="dt"></b></div><div class="row2"><button class="btn" id="clr">Clear day</button><button class="btn primary" id="done">Done</button></div></div></div>

</main><script>

/* ---------- Home ---------- */

ms.forEach(function(r){var b=el('button','mi');b.type='button';var l=el('span');l.append(document.createTextNode(fd(r.k,{day:'numeric',month:'short'})+' · '+L[r.n]));if(r.note)l.append(el('small',null,r.note));b.append(l,el('span',null,'−'+money(pr(r.n))));b.onclick=function(){openSheet(r.k)};h.append(b)})}

$('prev').onclick=function(){move(-1)};$('next').onclick=function(){move(1)};

N.forEach(function(n){var st=r[n]||'',box=el('div','meal'),top=el('div','mt'),info=el('div'),ch=el('div','ch');
info.append(el('b',null,I[n]+' '+L[n]),el('small',null,money(pr(n))));
[['yes','Yes','y'],['no','No','n'],['','—','u']].forEach(function(o){var b=el('button',st===o[0]?o[2]:'',o[1]);b.type='button';b.setAttribute('aria-pressed',String(st===o[0]));b.onclick=function(){setStatus(n,o[0])};ch.append(b)});
top.append(info,ch);box.append(top);
if(st){var inp=el('input');inp.type='text';inp.maxLength=120;inp.placeholder=st==='no'?'Why missed? (optional)':'Remark (optional)';inp.value=(r.notes&&r.notes[n])||'';inp.oninput=function(){setNote(n,inp.value)};box.append(inp)}

function setNote(n,v){var r=data.records[sel];if(!r)return;r.notes=r.notes||{};if(v.trim())r.notes[n]=v;else delete r.notes[n];clearTimeout(timer);timer=setTimeout(flush,400)}

$('done').onclick=closeSheet;$('scrim').onclick=closeSheet;

/* ---------- Tabs ---------- */
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){var v=b.dataset.v;document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('on',x===b)});$('v-home').hidden=v!=='home';$('v-set').hidden=v!=='set';window.scrollTo(0,0);if(v==='set')fillSettings()}});

N.forEach(function(n){$('p-'+n).onchange=function(){var v=this.value;if(v.trim()===''||!isFinite(Number(v))||Number(v)<0){this.value=data.prices[n];toast('Enter a valid price');return}data.prices[n]=Number(v);persist();renderHome();toast('Price saved')}});
document.querySelectorAll('#btype button').forEach(function(b){b.onclick=function(){btype=b.dataset.t;document.querySelectorAll('#btype button').forEach(function(x){x.classList.toggle('on',x===b)});$('fd').hidden=btype==='month'||btype==='range';$('fr').hidden=btype!=='range';$('fm').hidden=btype!=='month';hint()}});
$('bd').onchange=hint;$('bm').onchange=hint;$('b1').onchange=hint;$('b2').onchange=hint;
function quick(a,b){var base=y+'-'+p2(m+1)+'-';$('b1').value=base+p2(a);$('b2').value=base+p2(b||new Date(y,m+1,0).getDate());hint()}
$('q1').onclick=function(){quick(1,15)};$('q2').onclick=function(){quick(16)};
function range(){var s,e;if(btype==='range'){s=$('b1').value;e=$('b2').value;if(!s||!e)return null;if(s>e){var t=s;s=e;e=t}return[s,e]}if(btype==='month'){var v=$('bm').value;if(!/^\d{4}-\d{2}$/.test(v))return null;var yy=+v.slice(0,4),mm=+v.slice(5);s=v+'-01';e=kOf(new Date(yy,mm,0))}else{var v2=$('bd').value;if(!v2)return null;if(btype==='day')s=e=v2;else{var d=dOf(v2);d.setDate(d.getDate()-(d.getDay()+6)%7);s=kOf(d);d.setDate(d.getDate()+6);e=kOf(d)}}return[s,e]}

$('dl').onclick=function(){var r=range();if(!r){toast('Pick a date');return}try{var pdf=makePDF(bill(btype,r[0],r[1]));save(pdf,'TiffinTrack-'+btype+'-bill-'+r[0]+'.pdf','application/pdf');toast('Bill downloaded')}catch(e){toast('Could not create PDF')}};

$('imp').onclick=function(){$('impf').click()};
$('impf').onchange=function(ev){var f=ev.target.files[0];if(!f)return;f.text().then(function(t){var o=JSON.parse(t);if(!o||!o.prices||!o.records||typeof o.records!=='object')throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;var c={prices:{},records:{},profile:Object.assign({name:'',shop:''},o.profile)};N.forEach(function(n){var p=Number(o.prices[n]);c.prices[n]=isFinite(p)&&p>=0?p:0});Object.keys(o.records).forEach(function(k){var r=o.records[k];if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!r||typeof r!=='object')return;var it={},nt={};N.forEach(function(n){if(r[n]==='yes'||r[n]==='no'){it[n]=r[n];var s=r.notes&&r.notes[n];if(typeof s==='string'&&s.trim())nt[n]=s.slice(0,120)}});if(Object.keys(it).length){if(Object.keys(nt).length)it.notes=nt;c.records[k]=it}});data=c;persist();renderHome();fillSettings();toast('Backup restored')}).catch(function(e){toast('Restore failed: '+e.message)}).finally(function(){ev.target.value=''})};
/* ---------- Bill (canvas pages -> PDF, fully offline) ---------- */
var W=1240,H=1754,M=70,F='Inter,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",Arial,sans-serif';
function bill(type,s,e){

function T(t,px,py,font,col,al){x.font=font+' '+F;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)}
